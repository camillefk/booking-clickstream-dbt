# Secrets Template
# ================
#
# This file shows the STRUCTURE of secrets.
# NEVER commit actual secrets !!!
#
# For production, create secrets_actual.yaml with real values
# and add it to .gitignore

# ===================================================================
# 1. GCP SERVICE ACCOUNT (Only if needed - prefer Workload Identify!)
# ===================================================================
gcp:
  service_account:
    # Path to service account JSON key (if using one)
    # TIP: Use gcloud auth application-default login instead!
    key_path: "{PATH_TO_SERVICE_ACCOUNT_KEY}"
    # Example: key_path: "/home/camille/.gcp/service-account.json"

    # Service account email
    email: "{SERVICE_ACCOUNT_EMAIL}"
    # Example: email: "data-pipeline@my-project.iam.gserviceaccount.com"

    # Project ID (from service account)
    project_id: "{GCP_PROJECT_ID}"
    # Example: project_id: "my-sandbox-project"

# ===============================================
# 2. DATABASE CREDENTIALS (For Airflow, dbt, etc)
# ===============================================
database:
  # BigQuery credentials (usually handled by service account above)
  bigquery:
    project_id: "{GCP_PROJECT_ID}"
    location: "{GCP_REGION}"
    # BigQuery doesn't need additional secrets if using gcloud auth
  
  # PostgreSQL (if using for Airflow database)
  postgresql:
    host: "{POSTGRES_HOST}"
    port: 5432
    username: "{POSTGRES_USER}"
    password: "{POSTGRES_PASSWORD}"
    database: "airflow"
    # Example: host: "localhost" (for local postgres)

# ============================================================
# 3. API KEYS & TOKENS (If integrating with external services)
# ============================================================
api_keys:
  # Slack (for alerts)
  slack:
    webhook_url: "{SLACK_WEBHOOK_URL}"
    # Example: webhook_url: "https://hooks.slack.com/services/T00000/B00000/XXXX"
  
  # SendGrid (for email alerts)
  sendgrid:
    api_key: "{SENDGRID_API_KEY}"
    from_email: "{YOUR_EMAIL}"
    # Example: api_key: "SG.abc123def456..."

# ============================================================================
# 4. AUTHENTICATION & AUTHORIZATION
# ============================================================================
auth:
  # Airflow webUI credentials
  airflow:
    username: "admin"
    password: "{AIRFLOW_PASSWORD}"
    # TIP: Generate strong password: python -c "import secrets; print(secrets.token_urlsafe(32))"
  
  # dbt cloud API (if using dbt Cloud)
  dbt:
    api_key: "{DBT_CLOUD_API_KEY}"
    # Leave empty if using dbt CLI locally

# ============================================================================
# 5. ENVIRONMENT-SPECIFIC SECRETS
# ============================================================================
environments:
  development:
    # Development GCP project (sandbox)
    gcp_project_id: "{DEV_GCP_PROJECT_ID}"
    
    # Development BigQuery datasets
    bq_dataset_raw: "clickstream_raw_dev"
    bq_dataset_staging: "clickstream_staging_dev"
    bq_dataset_analytics: "clickstream_analytics_dev"
    
    # Development bucket
    gcs_bucket: "{DEV_GCP_PROJECT_ID}-clickstream-raw"
  
  production:
    # Production GCP project (different from dev!)
    gcp_project_id: "{PROD_GCP_PROJECT_ID}"
    
    # Production BigQuery datasets
    bq_dataset_raw: "clickstream_raw"
    bq_dataset_staging: "clickstream_staging"
    bq_dataset_analytics: "clickstream_analytics"
    
    # Production bucket
    gcs_bucket: "{PROD_GCP_PROJECT_ID}-clickstream-raw"

# ============================================================================
# 6. HOW TO USE THIS FILE
# ============================================================================
# 
# 1. Create actual secrets file (NOT this template):
#    cp config/secrets_template.yaml config/secrets_actual.yaml
#
# 2. Add to .gitignore:
#    echo "config/secrets_actual.yaml" >> .gitignore
#
# 3. Fill with REAL values in secrets_actual.yaml
#
# 4. In Python, load secrets:
#    import yaml
#    with open("config/secrets_actual.yaml") as f:
#        secrets = yaml.safe_load(f)
#    
#    project_id = secrets["gcp"]["service_account"]["project_id"]
#
# 5. In production, use secrets manager (not files!):
#    - Google Secret Manager
#    - HashiCorp Vault
#    - AWS Secrets Manager
#
# ============================================================================
# 7. SECURITY NOTES
# ============================================================================
#
# ✓ DO:
# - Store this template in Git (no secrets here)
# - Store actual secrets in .gitignore files or secret managers
# - Rotate secrets every 90 days
# - Use IAM roles instead of service account keys
# - Different secrets per environment
# - Encrypt secrets at rest
#
# ✕ DON'T:
# - Never commit secrets_actual.yaml to Git
# - Never share screenshots with secrets visible
# - Never hardcode secrets in code
# - Never use same secrets in dev and prod
# - Never push to GitHub accidentally
#
# ============================================================================